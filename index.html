<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-TWELV</title>
    <style>
        :root {
            --color-white: #ffffff;
            --color-black: #000000;
            --color-grey-dark: #333333;
            --color-grey-medium: #777777;
            --color-grey-light: #e0e0e0;
            --color-yellow: #f2c811;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--color-white);
            color: var(--color-black);
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: color 0.3s ease;
        }

        ul {
            list-style: none;
        }

        .main-header {
            background-color: var(--color-white);
            border-bottom: 1px solid var(--color-grey-light);
            padding: 20px 40px;
            width: 100%;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area img {
            max-height: 80px;
            display: block;
        }

        .nav-area {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
        }

        .top-links {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--color-grey-medium);
        }

        .top-links a:hover {
            color: var(--color-yellow);
        }

        .separator {
            color: var(--color-grey-light);
        }

        .main-menu ul {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .main-menu ul li a {
            font-size: 0.9rem;
            color: var(--color-grey-dark);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .main-menu ul li a:hover {
            color: var(--color-yellow);
        }

        .search-icon-wrapper {
            border-left: 1px solid var(--color-grey-light);
            padding-left: 20px;
            display: flex;
            align-items: center;
        }

        .search-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--color-grey-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s ease;
        }

        .search-btn:hover {
            color: var(--color-yellow);
        }

        .search-btn svg {
            width: 18px;
            height: 18px;
        }

    .hero-section {
    position: relative;
    width: 100%;
    height: 70vh;
    min-height: 450px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero-slider {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
}

.hero-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.70);
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
}

.hero-slide.active {
    opacity: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 800px;
    padding: 0 20px;
    color: var(--color-white);
}

.hero-title {
    font-size: 3rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    margin-bottom: 20px;
    color: var(--color-white);
}

.hero-subtitle {
    font-size: 1.2rem;
    font-weight: 300;
    color: var(--color-grey-light);
    margin-bottom: 30px;
    line-height: 1.6;
}

.hero-btn {
    display: inline-block;
    padding: 14px 35px;
    background-color: var(--color-yellow);
    color: var(--color-black);
    font-weight: 600;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    border: 2px solid var(--color-yellow);
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease, transform 0.2s ease;
}

.hero-btn:hover {
    background-color: transparent;
    color: var(--color-yellow);
    transform: translateY(-3px);
}
        
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <div class="logo-area">
                <a href="index.html">
                    <img src="G-TWELV-LOGO.jpeg" alt="G-TWELV Logo">
                </a>
            </div>
            <div class="nav-area">
                <div class="top-links">
                    <a href="index.html">Home</a>
                    <span class="separator">/</span>
                    <a href="#news">News</a>
                    <span class="separator">/</span>
                    <a href="#careers">Careers</a>
                    <span class="separator">/</span>
                    <a href="#contact">Contact Us</a>
                </div>
                <nav class="main-menu">
                    <ul>
                        <li><a href="#about">ABOUT US</a></li>
                        <li><a href="#brands">OUR BRANDS</a></li>
                        <li><a href="#sales">SALES & MARKETING</a></li>
                        <li><a href="#distribution">DISTRIBUTION</a></li>
                        <li class="search-icon-wrapper">
                            <button class="search-btn" aria-label="Search">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
                                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                                </svg>
                            </button>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

<section class="hero-section">
    <div class="hero-slider">
        <img src="assets/G-12 Ai.jfif" alt="G12 Delivery Van and Office Entrance" class="hero-slide active">
        <img src="" alt="G12 Facility" class="hero-slide">
    </div>
    <div class="hero-content">
        <h1 class="hero-title">G-TWELV</h1>
        <p class="hero-subtitle">Driving Innovation in Distribution and Brand Management</p>
        <a href="#about" class="hero-btn">Discover Our Story</a>
    </div>
</section>
    
    <script>
const slides = document.querySelectorAll('.hero-slide');
let currentSlide = 0;

setInterval(() => {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
}, 5000);
    </script>
</body>
</html>
